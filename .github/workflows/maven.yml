# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Build with Maven (Without test)
        # tests require setups, and are their own job
        run: mvn -B package --file pom.xml -Dmaven.test.skip=true -Darguments="-DskipTests"

  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Clone Openldap container
        uses: actions/checkout@v4
        with:
          repository: 'GIP-RECIA/docker-openldap-test'
          path: '.docker-openldap-test'
          ref: updates-for-pronote-ws

      - name: Start Openldap Container
        run:  docker compose -f .docker-openldap-test/docker-compose.yml up -d --build

      - name: Wait for OpenLDAP (1/2)
        run: |
          for i in {1..30}; do
            nc -z 127.0.0.1 389 && echo "LDAP ready" && exit 0
            echo "Waiting LDAP..."
            sleep 2
          done

          echo "LDAP not ready after 60 seconds"
          exit 1

      - name: Install LDAP client tools
        run: sudo apt-get update && sudo apt-get install -y ldap-utils

      - name : Wait for OpenLDAP (2/2)
        run: |
          for i in {1..30}; do
            ldapwhoami -x -H ldap://127.0.0.1:389 -D "cn=admin,ou=administrateurs,dc=esco-centre,dc=fr" -w admin && exit 0
            echo "Waiting LDAP bind..."
            sleep 2
          done
          exit 1

      - name: Create temp directories
        run: mkdir -p ${{ github.workspace }}/tmp

      - name: Run tests
        # order of profiles.active is important, if ci is written last, its conf will override test conf
        run: ./mvnw test -Dspring.profiles.active=test,ci -Dapp.upload.path=${{ github.workspace }}/tmp -Dapp.upload.protectedPath=${{ github.workspace }}/tmp -B
      #          -Dlogging.config=classpath:logback-ci.xml \

      - name: Stop containers
        if: always()
        run: docker compose -f .docker-openldap-test/docker-compose.yml down -v # -v très important, le openldap a des problemes lorsque les volumes ne sont pas détruit
